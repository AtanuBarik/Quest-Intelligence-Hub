name: Replicate source repository once

on:
  push:
    paths:
      - '.github/workflows/replicate-source-once.yml'

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source repository into target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: AtanuBarik/quest-intelligence-360
          TARGET_REPO: AtanuBarik/Quest.Intelligence.360
        run: |
          set -euo pipefail
          git clone --mirror "https://github.com/${SOURCE_REPO}.git" source.git
          cd source.git
          git remote set-url --push origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force --all origin
          git push --force --tags origin
